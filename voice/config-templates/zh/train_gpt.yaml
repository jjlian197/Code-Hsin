train:
  seed: 1234
  epochs: 20
  batch_size: 1
  save_every_n_epoch: 1
  precision: 16-mixed
  gradient_clip: 1.0
  exp_name: HsinZH
  half_weights_save_dir: <HSIN_ROOT>/voice/hsin_zh/weights/GPT
  if_save_latest: true
  if_save_every_weights: true
  if_dpo: false
optimizer:
  lr: 0.01
  lr_init: 1.0e-05
  lr_end: 0.0001
  warmup_steps: 2000
  decay_steps: 40000
data:
  max_eval_sample: 8
  max_sec: 54
  num_workers: 1
  pad_val: 1024
model:
  vocab_size: 1025
  phoneme_vocab_size: 732
  embedding_dim: 512
  hidden_dim: 512
  head: 16
  linear_units: 2048
  n_layer: 24
  dropout: 0
  EOS: 1024
  random_bert: 0
inference:
  top_k: 15
pretrained_s1: <GPT_SOVITS_ROOT>/GPT_SoVITS/pretrained_models/s1v3.ckpt
train_semantic_path: <HSIN_ROOT>/voice/hsin_zh/experiment/6-name2semantic.tsv
train_phoneme_path: <HSIN_ROOT>/voice/hsin_zh/experiment/2-name2text.txt
output_dir: <HSIN_ROOT>/voice/hsin_zh/experiment/logs_s1_v2ProPlus
